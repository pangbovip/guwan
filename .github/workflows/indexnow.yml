name: IndexNow ping

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "ja.html"
      - "policies.html"
      - "policies-ja.html"
      - "sitemap.xml"
      - "assets/**"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for GitHub Pages to publish
        run: sleep 90

      - name: Notify IndexNow
        run: |
          curl -sS -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -w "\nHTTP %{http_code}\n" \
            -d '{
              "host": "wenguhall.com",
              "key": "0ea057bd239466dbbabbc3059ad0d68a",
              "keyLocation": "https://wenguhall.com/indexnow-0ea057bd239466dbbabbc3059ad0d68a.txt",
              "urlList": [
                "https://wenguhall.com/",
                "https://wenguhall.com/ja.html",
                "https://wenguhall.com/policies.html",
                "https://wenguhall.com/policies-ja.html"
              ]
            }'
